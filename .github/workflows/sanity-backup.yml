name: Sanity dataset backup

# Added 2026-08-27 (PORTS.md card 6, pattern from presacademy).
#
# Nightly export of the production Sanity dataset (see BACKUP KINDS below) so a bad
# mutation, a bad seed re-run, or an accidental "Remove field" in Studio is always
# recoverable. Mary Ann is the only editor and there is no second copy of this
# content anywhere; that is the whole argument for the job.
#
# THE SCHEDULE IS ON, deliberately. presacademy disabled its identical schedule
# because a daily gate job billed a minute a day just to log "skipping".
# NateJ45/mas-monograms is a PUBLIC repo (verified 2026-08-27 via
# `gh repo view --json visibility`), and GitHub Actions minutes are free on public
# repositories, so that billing argument does not apply here. Leave it running.
#
# WARNING: the export is ENCRYPTED before upload, and that is load-bearing. This repo
# is PUBLIC, so any logged-in GitHub user can download workflow artifacts, and the
# dataset can hold content that must not be public. A plaintext artifact publishes
# all of it. (Until 2026-10-30 this file said the tarball was already encrypted but
# had no encrypt step; the workflow was disabled and the secrets did not exist, so
# nothing plaintext ever uploaded.) The gate refuses to export when BACKUP_PASSPHRASE
# is missing: skipping a backup is recoverable, publishing the dataset is not.
# Never upload the tarball without the openssl step. Pattern from presacademy.
#
# It is safe to have committed before the secrets exist: the `gate` job checks for
# SANITY_AUTH_TOKEN AND BACKUP_PASSPHRASE and the `export` job only runs when both
# are set. Until then each run logs a warning and stops. Setting both secrets is
# what turns it on, no file edit needed (the workflow also has to be enabled in
# GitHub). Keep a copy of the passphrase OUTSIDE GitHub. See docs/PENDING.md.

# BACKUP KINDS (2026-10-13, after the account-wide GitHub artifact quota filled).
#   -full  documents + assets. Built by the Monday scheduled run and by every
#          manual (workflow_dispatch) run. The only kind copied to R2 (weekly).
#   -docs  documents only (`--raw`: asset documents and references kept, asset
#          files not downloaded). Built by the other six scheduled nights.
# Both kinds are kept as the 14-day GitHub artifact. The file name says which:
# sanity-backup-<date>-full.tar.gz or sanity-backup-<date>-docs.tar.gz.
#
# RESTORING a docs-only backup relies on the referenced assets still existing in
# the dataset, and they do: Sanity assets survive document edits and "Remove
# field"; only an explicit asset delete removes one. Restore a -docs file into
# the SAME project and dataset only (the importer refuses asset documents that
# point at a different dataset). For a FULL restore, or a restore drill into a
# scratch dataset, use the latest Monday -full artifact, or the weekly R2 copy
# for anything older than 14 days.

on:
  schedule:
    - cron: '0 7 * * *' # daily 07:00 UTC (03:00 ET) — well clear of editing hours
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      # No checkout here on purpose: this job only reads a secret's presence, and
      # keeping it checkout-free is what keeps the daily no-op cheap.
      - id: check
        env:
          TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SANITY_AUTH_TOKEN not set; skipping backup. See docs/PENDING.md."
          elif [ -z "$PASSPHRASE" ]; then
            # No passphrase means the artifact would upload as PLAINTEXT on a
            # public repo. Refuse to export at all rather than publish the dataset.
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BACKUP_PASSPHRASE not set; skipping backup so the dataset never uploads unencrypted. See docs/PENDING.md."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  export:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The sanity CLI is a root dependency (Studio folded into root, PORTS.md
      # card 10) -- no nested studio/ workspace to install separately.
      - name: Install dependencies
        run: npm ci

      - name: Export production dataset
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          # This project's PUBLIC Sanity id (not a secret — it ships in the
          # client bundle and in every Studio URL).
          SANITY_STUDIO_PROJECT_ID: xp3elugr
          SANITY_STUDIO_DATASET: production
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          # Two kinds of backup (2026-10-13), named so the file says which:
          #   -full  documents + assets: the Monday scheduled run and every
          #          manual (workflow_dispatch) run. The only kind sent to R2.
          #   -docs  documents only: every other scheduled night.
          # Docs-only uses --raw, NOT --no-assets. --no-assets strips the asset
          # documents AND every image/file reference from the exported
          # documents, so restoring it with --replace would wipe the images off
          # production. --raw keeps the asset documents and the references and
          # only skips downloading the files.
          # The decision is made here once and handed to the R2 step through
          # $GITHUB_ENV, so the export kind and the weekly R2 gate cannot
          # disagree.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then
            KIND=docs
            EXPORT_FLAGS="--raw"
          else
            KIND=full
            EXPORT_FLAGS=""
          fi
          echo "BACKUP_KIND=$KIND" >> "$GITHUB_ENV"
          npx sanity dataset export production "sanity-backup-$STAMP-$KIND.tar.gz" $EXPORT_FLAGS

      # Encrypt BEFORE upload, see the header warning. AES-256-CBC with a
      # PBKDF2-stretched passphrase; openssl ships on every runner and laptop.
      - name: Encrypt the export
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -e
          ls sanity-backup-*.tar.gz
          for f in sanity-backup-*.tar.gz; do
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
              -in "$f" -out "$f.enc" -pass env:BACKUP_PASSPHRASE
            rm "$f"
          done
          ls -lh sanity-backup-*.tar.gz.enc

      - name: Upload backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: sanity-backup
          path: sanity-backup-*.tar.gz.enc
          if-no-files-found: error
          # 14 days (was 90 until 2026-10-13, when the account-wide GitHub
          # artifact storage quota filled up). This is the day-level recovery
          # window; the weekly R2 copy below is the durable one.
          retention-days: 14
      # OFF-SITE COPY. The artifact above expires after 14 days and lives in the
      # same GitHub account as the repo it protects, so a lost account loses the
      # site AND its backups together. R2 is a different provider and a
      # different blast radius.
      #
      # No new credentials: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are
      # already set in every site repo for the deploy. The token does need R2
      # write permission added to it - a deploy-only token will 403 here.
      #
      # To enable, per site:
      #   1. Create the bucket:  npx wrangler r2 bucket create <name>
      #   2. Add "Workers R2 Storage: Edit" to CLOUDFLARE_API_TOKEN
      #   3. Set the BACKUP_R2_BUCKET repo variable to <name>
      # Unset, this step skips with a warning and the artifact still uploads,
      # matching the stance of the gate job: a missing off-site copy must never
      # fail the backup that is otherwise working.
      #
      # The tarball is encrypted at this point (the "Encrypt the export" step). Do not move this step
      # above the encrypt step.
      - name: Copy the backup off-site to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.BACKUP_R2_BUCKET }}
        run: |
          if [ -z "$BUCKET" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::BACKUP_R2_BUCKET variable and/or Cloudflare credentials not set; the backup exists only as a 14-day GitHub artifact. See the header of sanity-backup.yml."
            exit 0
          fi
          # ONE OFF-SITE COPY A WEEK, not one a day (2026-09-18).
          #
          # The bucket had no expiry rule and was growing about 190MB a day
          # across the family with nothing ever deleting anything. The policy is
          # now one copy a week, keep the last 12, delete older: this gate is the
          # "one a week" half, and an R2 lifecycle rule on the bucket (prefix
          # "sanity/", 90 day age, which is 12 weeks plus slack) is the other.
          #
          # The DAILY run above is untouched on purpose. Its 14-day GitHub
          # artifact gives day-level recovery for a recent mistake; weekly
          # copies alone would mean losing up to seven days of edits in a
          # restore. So: the daily artifact covers the last 14 days at day
          # level, and the weekly R2 copy (keep 12) covers anything older.
          #
          # A MANUAL run always uploads, whatever day it is, so that verifying
          # this step never means waiting for Monday.
          #
          # BACKUP_KIND comes from the export step, so this gate always agrees with
          # what was exported. Only -full tarballs are picked up below.
          if [ "$BACKUP_KIND" != "full" ]; then
            echo "Off-site copy is weekly (the Monday full export). Today's backup is the docs-only 14-day GitHub artifact above."
            exit 0
          fi

          for f in sanity-backup-*-full.tar.gz.enc; do
            # Keyed by repo so one bucket can hold the whole family, and by date
            # so a bad dataset restored last week has not overwritten the good
            # copy from the week before.
            KEY="sanity/${GITHUB_REPOSITORY##*/}/$f"
            echo "uploading $f -> $BUCKET/$KEY"
            # `|| echo ::warning::` because the header of this step promises
            # "a missing off-site copy must never fail the backup that is
            # otherwise working", and a bare command does not honour that. The
            # realistic failure is CLOUDFLARE_API_TOKEN lacking "Workers R2
            # Storage: Edit". The artifact is uploaded before this step, so the
            # backup still exists; only the off-site COPY is lost.
            npx wrangler r2 object put "$BUCKET/$KEY" --file "$f" --remote               || echo "::warning::off-site copy of $f failed - the 14-day GitHub artifact is still the backup. Check CLOUDFLARE_API_TOKEN carries 'Workers R2 Storage: Edit'."
          done

# RESTORE (run locally, from the repo root, with SANITY_AUTH_TOKEN set):
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in sanity-backup-YYYY-MM-DD-full.tar.gz.enc \
#     -out sanity-backup-YYYY-MM-DD-full.tar.gz -pass env:BACKUP_PASSPHRASE
#   npx sanity dataset import sanity-backup-YYYY-MM-DD-full.tar.gz production --replace
# `--replace` overwrites documents that share an _id and leaves the rest alone.
# Import into a scratch dataset first if you are unsure what changed.
