# NOTE: the workflow `name:` below must stay "Lighthouse CI".
# dependabot-auto-merge.yml listens for that exact workflow name.
#
# ── WHEN IT RUNS (starter PORTS.md card 62) ─────────────────────────────────
# Lighthouse is the slowest gate here (about 9 minutes of a 3 minute CI) and it
# ran on every PR, including ones that cannot move a score. It is NOT a
# required status check (the ruleset requires only `build` and `test`), so it
# is free to be scheduled rather than blocking:
#
#   - pull_request, path-filtered to what can move a score (markup, styles,
#     assets, scripts, config), and audited on a SAMPLE of URLs, one per
#     distinct template, via --collect.url flags below. The full list in
#     lighthouserc.json is untouched.
#   - push to main, same path filter, FULL url list: the post-merge record.
#   - weekly schedule, FULL url list: catches drift nobody pushed (a font host
#     change, a dependency bump that landed on a different path).
#   - workflow_dispatch: a branch tip on demand, full list.
#
# A docs-only, content-only or workflow-only PR therefore runs no Lighthouse and
# reports no check, which the dependabot auto-merge workflow treats as green.
name: Lighthouse CI

on:
  push:
    branches: [main]
    paths: &score-paths
      - 'src/**'
      - 'public/**'
      - 'scripts/with-workerd.mjs'
      - 'lighthouserc.json'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lighthouse.yml'
  pull_request:
    paths: *score-paths
  schedule:
    - cron: '23 5 * * 1'
  # Manual runs so a branch can be audited before it reaches main
  # (`gh workflow run lighthouse.yml --ref <branch>`).
  workflow_dispatch:

# A newer push to the same branch obsoletes the in-flight run; cancel it
# instead of paying for both (private-repo Actions minutes are metered).
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: browser-actions/setup-chrome@v2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Credential-less, like ci.yml: the fixed pages render their empty-state
      # fallbacks and the embedded Studio shell builds alongside them.
      - name: Build
        run: npm run build

      # Accessibility is a hard gate (minScore 1) in lighthouserc.json, as are
      # LCP 4500ms and CLS 0.1; performance / best-practices / SEO are
      # warnings. Reports upload to Google's temporary public LHCI storage (24h
      # retention, shareable URL in the Action logs), acceptable for public
      # marketing pages.
      #
      # On a PR the URL list is overridden with ONE PAGE PER TEMPLATE. Passing
      # --collect.url replaces the config's list, so the assertions and the
      # median-of-3 stay exactly as lighthouserc.json defines them; only the
      # page set shrinks. The URLs keep the config's `http://localhost/<page>/
      # index.html` form because staticDistDir serves them on a random port.
      # The sample: home, the data-heavy pricing page, the quote form, the
      # image-heavy gallery, the swatch grid, and the 404. The other pages
      # (about, how-it-works, font guide, shop-by-item, clearance, thank-you)
      # are plain content or listing variants of those and run on push/weekly.
      - name: Lighthouse CI (sample, pull request)
        if: ${{ github.event_name == 'pull_request' }}
        run: >-
          npx lhci autorun
          --collect.url=http://localhost/index.html
          --collect.url=http://localhost/pricing/index.html
          --collect.url=http://localhost/request-a-quote/index.html
          --collect.url=http://localhost/style-gallery/index.html
          --collect.url=http://localhost/thread-color-chart/index.html
          --collect.url=http://localhost/404.html

      - name: Lighthouse CI (full)
        if: ${{ github.event_name != 'pull_request' }}
        run: npx lhci autorun
