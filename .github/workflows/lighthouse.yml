name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs so a staging branch can be audited before it reaches main
  # (`gh workflow run lighthouse.yml --ref staging`).
  workflow_dispatch:

# A newer push to the same branch obsoletes the in-flight run; cancel it
# instead of paying for both (private-repo Actions minutes are metered).
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: browser-actions/setup-chrome@v2

      - name: Install dependencies
        run: npm ci

      # Credential-less, like ci.yml: the fixed pages render their empty-state
      # fallbacks and the embedded Studio shell builds alongside them.
      - name: Build
        run: npm run build

      # Accessibility is a hard gate (minScore 1) in lighthouserc.json;
      # performance / best-practices / SEO are warnings. Reports upload to
      # Google's temporary public LHCI storage (24h retention, shareable URL in
      # the Action logs), acceptable for public marketing pages.
      - name: Lighthouse CI
        run: npx lhci autorun
