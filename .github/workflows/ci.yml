name: CI

# Restored 2026-08-27. This repo had ONLY lighthouse.yml, so a push that broke
# typegen, the type-check, lint or the unit tests still went green as long as the
# Lighthouse run happened to build. Modelled on
# ncs-astro-sanity-starter/.github/workflows/ci.yml (PORTS.md cards 5 and 15).
#
# 2026-09-05: brought up to the family test standard (WCP is the reference):
# astro check, prettier format check, an internal link check over dist/client,
# and a separate `test` job running the Playwright suites (smoke, axe, reflow)
# on chromium and a WebKit iPhone profile.

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch obsoletes the in-flight run; cancel it
# instead of paying for both (private-repo Actions minutes are metered).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # PORTS.md card 36. Every file here marked "PORTABLE: canonical copy" is
      # diffed against ncs-astro-sanity-starter, the library of record. Both
      # repos are public, so the checkout needs no token. CRLF is normalized to
      # LF and one trailing newline ignored before comparing, so a Windows
      # working tree and a Linux runner agree; everything else is byte-exact,
      # marker line included. On DRIFT: either port the improvement up into the
      # starter with a PORTS.md card in the same commit, or pull the starter's
      # copy forward here. A file that is forked on purpose drops its marker and
      # says so in its header instead.
      #
      # A staging build checks against the starter's staging, a main build (and
      # any PR) against its main. Without this the two-branch promotion model
      # cannot stage a canonical change at all: the starter's fix would have to
      # be promoted blind before any site could prove it. It also fixes the
      # promotion ORDER, which is now load-bearing - promote the starter first,
      # then the sites.
      - name: Check out the library of record
        uses: actions/checkout@v7
        with:
          repository: NateJ45/ncs-astro-sanity-starter
          ref: ${{ github.ref_name == 'staging' && 'staging' || 'main' }}
          path: .ncs-starter

      # The checkout is deleted again as soon as the check passes. It has to
      # live INSIDE the workspace (actions/checkout refuses a path outside it),
      # and every whole-tree tool further down this job would otherwise sweep
      # it: `prettier --check .` tries to format the library using THIS repo's
      # node_modules and dies resolving the starter's own imports, and `eslint .`
      # does the same. Deleting it here beats adding .ncs-starter to a
      # .prettierignore, a .gitignore and an eslint config in six repos, because
      # that list has to be remembered again for the next whole-tree tool.
      - name: Canonical files have not drifted
        id: sync_check
        continue-on-error: true
        env:
          NCS_STARTER_DIR: ${{ github.workspace }}/.ncs-starter
        run: node scripts/sync-check.mjs

      # Drift is a judgement, not a diff: an improvement made here either
      # belongs in the library or is site-specific. What was missing is that
      # porting it up was an errand you had to remember to start, in another
      # repo, after the build that blocked you. This opens the PR instead. It
      # never merges, and it never turns a clear "drift" failure into a
      # confusing "could not authenticate" one: it exits 0 whatever happens.
      - name: Propose the drift to the library of record
        if: steps.sync_check.outcome == 'failure'
        env:
          NCS_STARTER_DIR: ${{ github.workspace }}/.ncs-starter
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: node scripts/propose-drift.mjs

      # The checkout has to go before any whole-tree tool further down this
      # job sweeps it, and the gate has to fail for real once it has.
      - name: Enforce the drift check
        env:
          NCS_STARTER_DIR: ${{ github.workspace }}/.ncs-starter
        run: |
          rm -rf "$NCS_STARTER_DIR"
          [ "${{ steps.sync_check.outcome }}" = "success" ] || exit 1

      # `npm run typegen` == `sanity schema extract --force && sanity typegen
      # generate`, run from the repo root. Both read local schema files, so no
      # Sanity credentials are needed here; the CLI falls back to the
      # placeholder project id in sanity.cli.ts.
      #
      # NODE_OPTIONS raises the heap for this step only. `sanity schema extract`
      # bundles the whole Studio config and its import graph, and on the hosted
      # runners it intermittently dies with "Aborted (core dumped)" (exit 134)
      # while the same command succeeds locally: runner flake, not a schema
      # problem (WCP saw it twice on 2026-09-03 alone, both times passing on a
      # plain re-run). Retry up to three times before calling it red.
      - name: Generate Sanity types
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          for attempt in 1 2 3; do
            if npm run typegen; then exit 0; fi
            echo "::warning::typegen attempt $attempt failed (runner flake?) - retrying"
            sleep 15
          done
          echo "::error::typegen failed three times"
          exit 1

      - name: Fail if committed Sanity types are stale
        # Added 2026-08-27 (PORTS.md card 5, pattern from presacademy).
        # `npm run build` does NOT chain typegen, so src/lib/sanity.types.ts is
        # committed by hand after every schema change, and on 2026-08-27 it was
        # already two fields behind studioGuide (videoUrl, videoLabel), on a
        # green build. Catch it here.
        #
        # Safe to gate on: two consecutive local typegen runs were verified
        # byte-identical on 2026-08-27, so a diff here always means a stale
        # commit, never generator noise. Line endings are the one local-only
        # difference and git normalizes those.
        run: |
          if ! git diff --quiet -- src/lib/sanity.types.ts; then
            echo "::error::src/lib/sanity.types.ts is out of date. Run 'npm run typegen' and commit the result."
            git --no-pager diff -- src/lib/sanity.types.ts
            exit 1
          fi

      - name: Type check (astro check)
        run: npx astro check

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      # Pure-function unit tests on Node's built-in runner: slugify, reserved
      # slugs, the page-fields drift gate, the theme-token contrast pairs, the
      # preview helpers. Hermetic, no browser, no Sanity token.
      - name: Unit tests (node --test)
        run: npm run test:unit

      - name: Build Astro
        # Reads Sanity at build time but degrades to placeholder content when the
        # project id is absent (src/lib/sanity.ts), which is what makes a
        # credential-less CI build meaningful rather than a smoke screen. Since
        # 2026-08-28 this ALSO builds the embedded Studio at /studio.
        run: npm run build

      # Every internal link in dist/client resolves. /studio, /preview and /api
      # are SSR (dist/server) or a bare React mount shell, so links into them
      # are skipped rather than followed.
      - name: Check internal links
        run: npm run check:links

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both projects from playwright.config.ts: chromium (desktop) AND
      # webkit-iphone. Installing only chromium makes every webkit test die
      # with "Executable doesn't exist".
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # Runs the smoke, axe accessibility and reflow (320/768/1024/1440) suites
      # against a fresh production build (see playwright.config.ts webServer).
      # Credential-less like the build job above: the fixed pages render their
      # empty-state fallbacks, and tests/routes.ts only adds the CMS-driven
      # item-category and legal pages when the build actually emitted them.
      - name: Run tests (smoke, a11y, reflow)
        run: npm test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
